<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 학교 SFC 찾기 · 캠퍼스 인스타 디렉터리</title>
<meta name="description" content="전국 캠퍼스 SFC 인스타그램 계정을 찾고 첫 메시지를 보내 보세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --blue:#27509b; --blue-d:#1b3b78; --blue-soft:#e9eff9;
    --teal:#4fa7bd; --teal-d:#2f8aa1; --teal-soft:#e4f3f7;
    --ink:#10224a; --ink-2:#4b5a7a; --ink-3:#8b97b0;
    --bg:#f7f9fc; --card:#fff; --line:#dfe6f1;
    --cut:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color:var(--ink);line-height:1.5;letter-spacing:-.01em;background:var(--bg)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:520px;margin:0 auto;padding:0 18px 120px;position:relative}

  /* ---------- HERO : 블루프린트 그리드 + 45° 사선 ---------- */
  .hero{position:relative;overflow:hidden;background:var(--blue);color:#fff;padding:40px 0 78px}
  .hero::before{content:"";position:absolute;inset:0;opacity:.06;
    background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:56px 56px}
  .hero::after{content:"";position:absolute;left:-10%;right:-10%;top:50%;height:1.5px;background:rgba(255,255,255,.35);transform:rotate(-45deg)}
  .hero .guide{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,.22)}
  .hero .guide.h{left:0;right:0;width:auto;height:1.5px;top:auto}
  .hero-in{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 22px}
  .logo{display:block;width:150px;color:#fff}
  .logo svg,.wm svg{display:block;width:100%;height:auto}
  .wm{display:block;width:120px;color:rgba(255,255,255,.78);margin-top:12px}
  .tag{display:inline-block;margin-top:26px;font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);background:#fff;
    padding:6px 16px 6px 12px;border-radius:999px 0 0 999px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
  .hero h1{font-size:28px;line-height:1.32;font-weight:800;letter-spacing:-.035em;margin-top:12px}
  .hero h1 em{font-style:normal;color:#9fe0ef}
  .hero p{color:rgba(255,255,255,.82);font-size:15px;margin-top:8px}

  /* ---------- SEARCH ---------- */
  .search-bar{position:sticky;top:0;z-index:10;margin:-46px -18px 0;padding:10px 18px 8px;background:transparent;transition:background .2s}
  .search-bar.stuck{background:rgba(247,249,252,.96);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--card);
    border-radius:999px 0 0 999px;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%);
    padding:0 10px 0 18px;height:56px}
  .search-wrap{filter:drop-shadow(0 8px 18px rgba(16,34,74,.2))}
  .search{border:0}.search:focus-within{box-shadow:inset 0 0 0 2px var(--teal)}
  .search svg{flex:none;color:var(--blue)}
  .search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none;color:var(--ink);min-width:0}
  .search input::placeholder{color:var(--ink-3)}
  .search input::-webkit-search-cancel-button{display:none}
  .clear{width:34px;height:34px;border-radius:50%;display:none;place-items:center;color:var(--ink-3);font-size:16px;margin-right:6px}
  .clear.show{display:grid}
  .clear:hover{background:var(--bg)}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 16px 8px 14px;font-size:14px;font-weight:700;color:var(--blue);background:var(--card);white-space:nowrap;
    border-radius:999px 0 0 999px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);box-shadow:inset 0 0 0 1.5px var(--line)}
  .chip.on{background:var(--blue);color:#fff;box-shadow:none}

  .meta{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 4px;font-size:14px;color:var(--ink-2)}
  .meta b{color:var(--blue);font-weight:800;font-size:16px}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink-2)}
  .switch{width:42px;height:24px;border-radius:999px;background:#cfd8e6;position:relative;transition:background .2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
  .toggle[aria-checked="true"] .switch{background:var(--teal)}
  .toggle[aria-checked="true"] .switch::after{transform:translateX(18px)}

  /* ---------- LIST ---------- */
  .group{margin-top:26px}
  .group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 10px}
  .group-head h2{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--blue)}
  .group-head h2::before{content:"";width:18px;height:12px;background:var(--teal);clip-path:polygon(40% 0,100% 0,60% 100%,0 100%)}
  .group-head h2 small{font-size:13px;color:var(--ink-3);font-weight:600}
  .u-link{font-size:13px;font-weight:700;color:var(--teal-d);background:var(--teal-soft);padding:6px 14px 6px 11px;white-space:nowrap;
    border-radius:999px 0 0 999px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
  .u-note{font-size:13px;color:var(--ink-3);padding:0 4px 10px;margin-top:-4px}

  .card{position:relative;background:var(--card);filter:drop-shadow(0 2px 6px rgba(16,34,74,.06));padding:16px 16px 14px;margin-bottom:10px;border-left:4px solid var(--blue);
    clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);box-shadow:0 1px 0 var(--line)}
  .card.none{border-left-color:#c9d3e3}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-right:12px}
  .name{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .handle{font-size:14px;color:var(--teal-d);font-weight:600;margin-top:1px;word-break:break-all}
  .badge{flex:none;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.01em}
  .badge.yes{background:var(--teal-soft);color:var(--teal-d)}
  .badge.no{background:#eef1f6;color:var(--ink-3)}
  .with{font-size:13.5px;color:var(--ink-2);margin-top:10px;background:var(--bg);padding:8px 11px;border-left:2px solid var(--teal)}
  .with b{color:var(--ink);font-weight:700;margin-right:4px}
  .actions{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;height:46px;font-size:14.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:999px 0 0 999px;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-d)}
  .btn.ghost{background:var(--blue-soft);color:var(--blue)}
  .btn.teal{background:var(--teal);color:#fff}
  .btn.white{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--line)}
  .fallback{font-size:13.5px;color:var(--ink-2);margin-top:10px}
  .fallback a{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}

  .empty{text-align:center;padding:50px 10px;color:var(--ink-2)}
  .empty .big{font-size:40px}
  .empty p{margin-top:8px}
  .empty button{margin-top:14px;color:var(--blue);font-weight:800;text-decoration:underline;text-underline-offset:3px}

  /* ---------- DOCK & FOOTER ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 65%,rgba(247,249,252,0))}
  .dock-in{max-width:520px;margin:0 auto;display:flex;gap:8px}
  .dock .btn{height:52px}

  footer{margin-top:40px;padding:26px 0 0;border-top:1.5px solid var(--line);text-align:center;color:var(--ink-3);font-size:12.5px;line-height:1.7}
  footer .fw{width:150px;margin:0 auto 12px;color:var(--blue);opacity:.9}
  footer .fw svg{display:block;width:100%;height:auto}

  /* ---------- MODAL ---------- */
  .scrim{position:fixed;inset:0;background:rgba(16,34,74,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .scrim.open{display:flex;animation:fade .18s ease}
  .sheet{position:relative;background:var(--card);width:100%;max-width:520px;padding:12px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.2,1);clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%)}
  .sheet::before{content:"";display:block;height:5px;margin:-12px -20px 16px;background:linear-gradient(90deg,var(--blue) 70%,var(--teal) 70%)}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-right:18px}
  .sheet h3{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--blue)}
  .x{width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--ink-3)}
  .x:hover{background:var(--bg)}
  .sheet .desc{font-size:14px;color:var(--ink-2);margin-bottom:14px}
  label.f{display:block;font-size:13px;font-weight:800;color:var(--ink-2);margin:12px 0 6px}
  label.f span{color:var(--teal-d)}
  .in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;font:inherit;font-size:16px;color:var(--ink);background:#fff;outline:0}
  .in:focus{border-color:var(--blue)}
  textarea.in{resize:vertical;min-height:150px;line-height:1.6}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sheet .actions{margin-top:16px}
  .qr-box{position:relative;display:grid;place-items:center;padding:24px;margin:6px 0 4px;background:var(--blue)}
  .qr-box canvas{width:200px;height:200px;image-rendering:pixelated;background:#fff}
  .qr-box .qlogo{width:90px;color:#fff;margin-top:14px}
  .qr-box .qlogo svg{display:block;width:100%;height:auto}
  .qr-url{font-size:12.5px;color:var(--ink-3);text-align:center;word-break:break-all;margin-top:8px}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:80;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  @media (min-width:600px){
    .scrim{align-items:center}
    .hero{padding:56px 0 90px}
    .hero h1{font-size:32px}
    .logo{width:180px}
  }
</style>
</head>

  const q = norm(state.q);
  if (r.hay.includes(q)) return true;
  for (const [k,v] of Object.entries(ALIAS)) if (q.includes(norm(k)) && r.hay.includes(norm(q.replace(norm(k), norm(v))))) return true;
  return false;
}

function card(r){
  const withLine = r.note ? `<div class="with"><b>함께하는 학교·참고</b>${esc(r.note)}</div>` : '';
  if (r.ig){
    return `<article class="card">
      <div class="card-top"><div><div class="name">${esc(r.n)}</div><div class="handle">@${esc(r.ig)}</div></div><span class="badge yes">인스타 있음</span></div>
      ${withLine}
      <div class="actions">
        <button class="btn primary" data-dm="${esc(r.ig)}" data-name="${esc(r.n)}">첫 DM 보내기</button>
        <a class="btn ghost" href="${igUrl(r.ig)}" target="_blank" rel="noopener">계정 보기</a>
      </div></article>`;
  }
  const fb = r.uIg ? `<p class="fallback">아직 개별 계정이 없어요. <a href="${igUrl(r.uIg)}" target="_blank" rel="noopener">${esc(r.u)} 계정(@${esc(r.uIg)})</a>으로 문의해 주세요.</p>` : '';
  return `<article class="card none">
    <div class="card-top"><div><div class="name">${esc(r.n)}</div></div><span class="badge no">계정 없음</span></div>
    ${withLine}${fb}</article>`;
}

function render(){
  const list = $('list'); let html = '', total = 0;
  DATA.forEach(g=>{
    const hits = rows.filter(r=>r.u===g.u && match(r));
    const showEmptyGroup = !state.q && !state.onlyIg && g.items.length===0 && (state.u==='전체'||state.u===g.u);
    if (!hits.length && !showEmptyGroup) return;
    total += hits.length;
    const uLink = g.ig ? `<a class="u-link" href="${igUrl(g.ig)}" target="_blank" rel="noopener">@${esc(g.ig)}</a>` : '';
    html += `<section class="group"><div class="group-head"><h2>${esc(g.u)}<small>${hits.length}곳</small></h2>${uLink}</div>`;
    if (g.note) html += `<p class="u-note">${esc(g.note)}</p>`;
    if (!hits.length) html += `<p class="u-note">지역 대표 계정으로 문의해 주세요.</p>`;
    html += hits.map(card).join('') + `</section>`;
  });
  if (!html) html = `<div class="empty"><div class="big">🔍</div><p>‘${esc(state.q)}’에 맞는 캠퍼스를 찾지 못했어요.<br>줄임말 대신 정식 이름으로 검색해 보세요.</p><button id="toReport">우리 학교 제보하기</button></div>`;
  list.innerHTML = html;
  $('count').textContent = total;
  const tr = $('toReport'); if (tr) tr.onclick = () => { $('repSchool').value = state.q; openModal('repModal'); };
}

/* ---------- 검색/토글 ---------- */
$('q').addEventListener('input', e=>{ state.q = e.target.value.trim(); $('clear').classList.toggle('show', !!e.target.value); render(); });
$('clear').onclick = ()=>{ $('q').value=''; state.q=''; $('clear').classList.remove('show'); $('q').focus(); render(); };
$('onlyIg').onclick = e=>{ state.onlyIg = !state.onlyIg; e.currentTarget.setAttribute('aria-checked', state.onlyIg); render(); };

/* ---------- 모달 ---------- */
function openModal(id){ const m=$(id); m.classList.add('open'); m.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
function closeModal(m){ m.classList.remove('open'); m.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
document.querySelectorAll('.scrim').forEach(m=>{
  m.addEventListener('click', e=>{ if (e.target===m || e.target.closest('[data-close]')) closeModal(m); });
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape') document.querySelectorAll('.scrim.open').forEach(closeModal); });

/* ---------- 복사 ---------- */
async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); }
  catch { const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(msg||'복사했어요');
}
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- 첫 DM ---------- */
let dmTarget = null, dmEdited = false;
function dmText(){
  const n=$('dmName').value.trim()||'○○○', y=$('dmYear').value.trim(), c=$('dmChurch').value.trim();
  return `안녕하세요! ${dmTarget.name}${y?' '+y:''} ${n}입니다 🙂\n${c?c+'에 다니고 있고, ':''}SFC 모임에 함께하고 싶어서 연락드려요.\n모임 시간이랑 장소를 알려 주실 수 있을까요? 감사합니다!`;
}
function refreshDm(){ if (!dmEdited) $('dmMsg').value = dmText(); }
['dmName','dmYear','dmChurch'].forEach(id=>$(id).addEventListener('input', refreshDm));
$('dmMsg').addEventListener('input', ()=> dmEdited = true);
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-dm]'); if (!b) return;
  dmTarget = { ig:b.dataset.dm, name:b.dataset.name }; dmEdited = false;
  $('dmDesc').textContent = `${dmTarget.name} SFC(@${dmTarget.ig})에 보낼 첫 인사예요.`;
  $('dmOpen').href = 'https://ig.me/m/' + encodeURIComponent(dmTarget.ig);
  refreshDm(); openModal('dmModal');
});
$('dmCopy').onclick = ()=> copy($('dmMsg').value, '메시지를 복사했어요. DM 창에 붙여넣으세요!');
$('dmOpen').addEventListener('click', ()=>{ navigator.clipboard && navigator.clipboard.writeText($('dmMsg').value).catch(()=>{}); });

/* ---------- QR ---------- */
function drawQr(){
  const url = location.href.split('#')[0];
  $('qrUrl').textContent = url;
  const qr = qrcode(0,'M'); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), cv=$('qrCanvas'), ctx=cv.getContext('2d'), m=4, s=Math.floor(cv.width/(n+m*2)), off=Math.floor((cv.width-s*n)/2);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle='#27509b';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect(off+c*s, off+r*s, s, s);
}
$('openQr').onclick = ()=>{ drawQr(); openModal('qrModal'); };
$('qrCopy').onclick = ()=> copy($('qrUrl').textContent, '링크를 복사했어요');
$('qrSave').onclick = ()=>{
  const W=640,H=780,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#27509b'; x.fillRect(0,0,W,H);
  x.fillStyle='#fff'; x.fillRect(120,90,400,400); x.drawImage($('qrCanvas'),120,90,400,400);
  const svg=document.querySelector('.qr-box .qlogo svg').outerHTML.replace('currentColor','#ffffff');
  const img=new Image(); img.onload=()=>{ const w=220,h=w*img.height/img.width; x.drawImage(img,(W-w)/2,560,w,h);
    x.fillStyle='rgba(255,255,255,.85)'; x.font='600 22px Pretendard, sans-serif'; x.textAlign='center'; x.fillText('우리 학교 SFC 찾기',W/2,560+h+48);
    const a=document.createElement('a'); a.download='SFC_캠퍼스찾기_QR.png'; a.href=c.toDataURL('image/png'); a.click(); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};

/* ---------- 제보 ---------- */
$('openReport').onclick = ()=> openModal('repModal');
$('repCopy').onclick = ()=>{
  const s=$('repSchool').value.trim(), b=$('repBody').value.trim();
  if (!s||!b){ toast('학교 이름과 제보 내용을 적어 주세요'); return; }
  const w=$('repWho').value.trim();
  copy(`[SFC 캠퍼스 인스타 제보]\n유형: ${$('repType').value}\n학교/센터: ${s}\n내용: ${b}${w?'\n제보자: '+w:''}`, '제보 내용을 복사했어요. 담당 간사에게 보내 주세요!');
};

const sb=document.querySelector('.search-bar');
addEventListener('scroll',()=>sb.classList.toggle('stuck', sb.getBoundingClientRect().top<=0 && scrollY>200),{passive:true});
render();
</script>
